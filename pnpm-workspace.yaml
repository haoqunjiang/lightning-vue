packages:
  - packages/*
  - apps/*
  - tools/*

allowBuilds:
  "@parcel/watcher": true

catalog:
  "@types/node": ^24.13.6
  "@vue/compiler-core": ^3.5.43
  "@vue/compiler-sfc": ^3.5.43
  "@vue/server-renderer": ^3.5.43
  "@vue/shared": ^3.5.43
  vue: ^3.5.43
  bumpp: ^11.1.0
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vite-plus: 0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24

catalogMode: prefer

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
